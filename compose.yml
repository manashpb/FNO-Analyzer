services:
  fno-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fno-analyzer
    restart: unless-stopped
    environment:
      FNO_CONFIG: /app/config.json
      FNO_SERVER_HOST: 0.0.0.0
      FNO_SERVER_PORT: 8000
      FNO_DATA_DIR: /app/data
      FNO_AOC_TOKEN: ${FNO_AOC_TOKEN:-}
      FNO_DHAN_JWT: ${FNO_DHAN_JWT:-}
      FNO_DHAN_ENTITY_ID: ${FNO_DHAN_ENTITY_ID:-}
      FNO_DHAN_CLIENT_ID: ${FNO_DHAN_CLIENT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fno-data:/app/data

volumes:
  fno-data:
