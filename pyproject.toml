[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fno-analyzer-v2"
version = "2.0.0"
description = "NSE FNO option-chain dashboard"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0,<3.0.0", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]
